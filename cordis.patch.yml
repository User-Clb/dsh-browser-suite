# dsh-browser-suite 的组合包 patch 层。
#
# 只插入 **一行**（裸包名）：Host 半区由 index.js 提供；Client 半区由
# dsh-client-modules 依据 package.json 的 `dsh.client` 声明自动发现，
# 并把 exports["./client"]（client.cjs）挂到这一行上。
#
# ⚠️ 不要再插入第二行 `dsh-browser-suite-client`：
# 第二行的 name 也是裸包名，loader 会把它当成同一个包再实例化一次 Host，
# 于是 index.js 的 apply 跑两遍 → prompt section "tool:browser_search"
# 重复注册 → 该行报 "did not activate"。
- insert:
    - id: dsh-browser-suite
      name: dsh-browser-suite
